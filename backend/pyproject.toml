[project]
name = "sre-ai-platform"
version = "0.1.0"
description = "Plataforma de IA para suporte tecnico, SRE e infraestrutura"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# E501: line length ja controlado pelo formatter/revisao manual.
# UP042: manter (str, Enum) em vez de StrEnum — serializacao Pydantic v2
# estavel e testada; StrEnum tem reprs diferentes e exigiria revalidar
# todos os contratos JSON da API.
ignore = ["E501", "UP042"]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*", "migrations/*"]
