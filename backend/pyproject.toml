[project]
name = "sre-ai-platform"
version = "0.1.0"
description = "Plataforma de IA para suporte tecnico, SRE e infraestrutura"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*", "migrations/*"]
