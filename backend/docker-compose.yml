services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sre-ai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sreai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-sreai}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sreai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sre-ai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    image: sre-ai-platform:latest
    container_name: sre-ai-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sreai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sreai}
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: ${VECTOR_BACKEND:-local}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ml_artifacts:/app/app/ml/artifacts
      - datasets_data:/app/datasets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    command: >
      sh -c "pip show psycopg2-binary >/dev/null 2>&1 || pip install --quiet psycopg2-binary &&
             alembic upgrade head &&
             python scripts/seed.py &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2 --timeout 120"

  # Executa o treinamento em container: docker compose run --rm train
  train:
    build: .
    image: sre-ai-platform:latest
    profiles: ["train"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sreai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sreai}
    volumes:
      - ml_artifacts:/app/app/ml/artifacts
      - datasets_data:/app/datasets
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip show psycopg2-binary >/dev/null 2>&1 || pip install --quiet psycopg2-binary &&
             python scripts/build_dataset.py --rows 1500 &&
             python scripts/train_nn.py --epochs 20"

volumes:
  db_data:
  ml_artifacts:
  datasets_data:
