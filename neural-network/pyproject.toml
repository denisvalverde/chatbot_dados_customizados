[project]
name = "ticket-classifier"
version = "1.0.0"
description = "Classificador multiclasse de chamados de suporte (TF-IDF + MLP em PyTorch)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2,<3.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.4,<2.0",
    "pydantic>=2.5,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "PyYAML>=6.0,<7.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
mlflow = ["mlflow>=2.12,<3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["src*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
